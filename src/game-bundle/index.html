<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>{{ title }}</title>
    {{ icon }}
    <link rel="stylesheet" href="./index.css">
    {{ styles }}
    {{ head }}
</head>

<body>
    <div id="ui-container"></div>
    <div id="hud">
        <button id="hud-auto" class="hud-btn">Auto</button>
        <button id="hud-skip" class="hud-btn">Skip</button>
        <button id="hud-history" class="hud-btn">History</button>
        <button id="hud-menu" class="hud-btn">Menu</button>
    </div>
    <div id="history-overlay" class="hidden">
        <div class="history-modal">
            <h2>History</h2>
            <div id="history-list"></div>
            <button id="history-close" class="close-button">Close</button>
        </div>
    </div>
    <main>
        {{ body }}
        <div id="game-scene">
            <img id="background" alt="background">
            <div id="sprites-container"></div>
            <div id="choices-container"></div>
            <div id="dialog-box"></div>
        </div>
    </main>
    <script type="module" src="./index.js"></script>
    {{ scripts }}
</body>

</html>
